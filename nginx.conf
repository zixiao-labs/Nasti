# Nasti 官网 nginx 配置参考
# 适用于自行部署到服务器的场景（非 GitHub Pages）

# === 步骤 1: 安装 certbot 获取 Let's Encrypt 证书 ===
#
# Ubuntu/Debian:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d nasti.zixiaolabs.com
#
# macOS (Homebrew):
#   brew install certbot
#   sudo certbot certonly --standalone -d nasti.zixiaolabs.com
#
# 自动续期（certbot 安装后通常自动配置）:
#   sudo certbot renew --dry-run
#
# === 步骤 2: DNS 配置 ===
#
# 在域名 DNS 中添加 A 记录:
#   nasti.zixiaolabs.com → 你的服务器 IP
#
# === 步骤 3: 使用以下 nginx 配置 ===

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name nasti.zixiaolabs.com;
    return 301 https://$host$request_uri;
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    server_name nasti.zixiaolabs.com;

    # Let's Encrypt 证书路径（certbot 自动生成）
    ssl_certificate     /etc/letsencrypt/live/nasti.zixiaolabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nasti.zixiaolabs.com/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 网站根目录（将 website/ 目录的内容部署到这里）
    root /var/www/nasti;
    index index.html;

    # 静态文件缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 回退（文档页 404 时回退到首页）
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}

# === 如果使用 GitHub Pages（推荐）===
#
# 不需要 nginx 和 certbot！GitHub Pages 自动提供：
# - Let's Encrypt SSL 证书（自动签发和续期）
# - CDN 加速
# - HTTPS 强制跳转
#
# 设置步骤：
# 1. DNS: 添加 CNAME 记录
#      nasti.zixiaolabs.com → zixiao-labs.github.io
#
# 2. GitHub repo → Settings → Pages:
#      - Source: GitHub Actions
#      - Custom domain: nasti.zixiaolabs.com
#      - ✅ Enforce HTTPS
#
# 3. 等待 DNS 生效（最多 24 小时），GitHub 会自动：
#      - 验证域名所有权
#      - 签发 Let's Encrypt 证书
#      - 启用 HTTPS
#
# 完成！无需任何服务器。
